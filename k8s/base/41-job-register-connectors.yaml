# One-off Job: registers the 4 Debezium outbox connectors on the Connect worker.
# The JSON templates (connectors/*.json, mounted from the generated ConfigMap) contain __TOKENS__ that are
# replaced from the DB secret/config here, then PUT to the Connect REST API (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: register-debezium-connectors
  namespace: ridehail
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.9.1
          env:
            - { name: TRIP_DB_HOST, valueFrom: { configMapKeyRef: { name: ridehail-config, key: TRIP_DB_URL } } }
            - { name: LOCATION_DB_HOST, valueFrom: { configMapKeyRef: { name: ridehail-config, key: LOCATION_DB_URL } } }
            - { name: PAYMENT_DB_HOST, valueFrom: { configMapKeyRef: { name: ridehail-config, key: PAYMENT_DB_URL } } }
            - { name: MATCHING_DB_HOST, valueFrom: { configMapKeyRef: { name: ridehail-config, key: MATCHING_DB_URL } } }
            - { name: MATCHING_DB_USER, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: MATCHING_DB_USER } } }
            - { name: MATCHING_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: MATCHING_DB_PASSWORD } } }
            - { name: TRIP_DB_USER, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: TRIP_DB_USER } } }
            - { name: TRIP_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: TRIP_DB_PASSWORD } } }
            - { name: LOCATION_DB_USER, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: LOCATION_DB_USER } } }
            - { name: LOCATION_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: LOCATION_DB_PASSWORD } } }
            - { name: PAYMENT_DB_USER, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: PAYMENT_DB_USER } } }
            - { name: PAYMENT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ridehail-db-credentials, key: PAYMENT_DB_PASSWORD } } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until curl -fsS http://debezium-connect:8083/connectors >/dev/null; do echo "waiting for Connect..."; sleep 5; done

              # register <service> <jdbc-url> <user> <password>
              # NOTE: sed uses '#' as delimiter, so passwords must not contain '#' (use External Secrets + simple charset).
              register() {
                svc="$1"; url="$2"; user="$3"; pass="$4"
                host=$(echo "$url" | sed -E 's#jdbc:postgresql://([^:/]+).*#\1#')
                body=$(sed -e "s#__DB_HOST__#$host#" -e "s#__DB_USER__#$user#" -e "s#__DB_PASSWORD__#$pass#" "/connectors/$svc-outbox.json")
                echo "registering $svc-outbox-connector on host $host"
                curl -fsS -X PUT -H 'Content-Type: application/json' --data "$body" \
                  "http://debezium-connect:8083/connectors/$svc-outbox-connector/config" >/dev/null
              }
              register trip     "$TRIP_DB_HOST"     "$TRIP_DB_USER"     "$TRIP_DB_PASSWORD"
              register location "$LOCATION_DB_HOST" "$LOCATION_DB_USER" "$LOCATION_DB_PASSWORD"
              register payment  "$PAYMENT_DB_HOST"  "$PAYMENT_DB_USER"  "$PAYMENT_DB_PASSWORD"
              register matching "$MATCHING_DB_HOST" "$MATCHING_DB_USER" "$MATCHING_DB_PASSWORD"
              echo done
          volumeMounts: [{ name: connectors, mountPath: /connectors }]
      volumes:
        - name: connectors
          configMap: { name: debezium-connectors }     # generated by kustomize configMapGenerator
