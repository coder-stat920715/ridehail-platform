metadata: { name: location-service, namespace: ridehail }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: location-service }
  minReplicas: 3
  maxReplicas: 15              # highest write/read QPS (driver pings every ~4 s)
