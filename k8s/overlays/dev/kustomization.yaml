apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Image names/tags (the CI pipeline sets the tag to the git SHA): kustomize edit set image ...
images:
  - { name: ridehail/eureka-server,    newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/eureka-server,    newTag: dev }
  - { name: ridehail/api-gateway,      newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/gateway-service,  newTag: dev }
  - { name: ridehail/trip-service,     newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/trip-service,     newTag: dev }
  - { name: ridehail/location-service, newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/location-service, newTag: dev }
  - { name: ridehail/payment-service,  newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/payment-service,  newTag: dev }
  - { name: ridehail/matching-service,     newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/matching-service,     newTag: dev }
  - { name: ridehail/notification-service, newName: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ridehail/notification-service, newTag: dev }
patches:
  # dev: smaller footprint
  - target: { kind: Deployment, name: "api-gateway|trip-service|location-service" }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: "payment-service|matching-service|notification-service" }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: StatefulSet, name: eureka-server }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 0 }
