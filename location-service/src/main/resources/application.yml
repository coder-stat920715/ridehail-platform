server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: location-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOCATION_DB_URL:jdbc:postgresql://localhost:5432/locationdb}
    username: ${LOCATION_DB_USER:location}
    password: ${LOCATION_DB_PASSWORD:location}
    hikari:
      maximum-pool-size: 40
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}       # ElastiCache for the read model (separate from the gateway limiter Redis)
      port: 6379
      timeout: 50ms                       # fail fast; the <10ms lookup budget has no room for slow Redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ridehail}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: location-query-projector
      enable-auto-commit: false
      auto-offset-reset: latest           # a location projector only cares about fresh positions
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: batch

ridehail:
  topics:
    driver-location: outbox.event.driver-location

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
