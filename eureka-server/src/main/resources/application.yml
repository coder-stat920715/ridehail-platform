server:
  port: 8761
  shutdown: graceful

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    # Standalone (local): do not register with / fetch from itself.
    # Clustered (k8s StatefulSet peers): set both to true and EUREKA_PEERS to the other peers.
    register-with-eureka: ${EUREKA_PEER_MODE:false}
    fetch-registry: ${EUREKA_PEER_MODE:false}
    service-url:
      defaultZone: ${EUREKA_PEERS:http://localhost:8761/eureka/}
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 10000
    response-cache-update-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
