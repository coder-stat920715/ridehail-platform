server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: matching-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MATCHING_DB_URL:jdbc:postgresql://localhost:5432/matchingdb}
    username: ${MATCHING_DB_USER:matching}
    password: ${MATCHING_DB_PASSWORD:matching}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:                       # dead-letter publishing only; business replies go through the outbox
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: matching-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

ridehail:
  topics:
    matching-command: outbox.event.matching-command   # produced by trip-service (aggregatetype matching-command)
    trip-events: outbox.event.trip                    # produced by trip-service (aggregatetype trip)
  matching:
    offer-timeout-seconds: ${OFFER_TIMEOUT_SECONDS:60}   # driver must accept within this time
  clients:
    location:
      base-url: ${LOCATION_SERVICE_URL:http://location-service}   # logical Eureka name

resilience4j:
  circuitbreaker:
    instances:
      driverSearch:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 5
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      driverSearch:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
